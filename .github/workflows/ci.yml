name: CI
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run Zig tests
        run: zig build test --summary all

      - name: Build library (Debug)
        run: zig build -Doptimize=Debug

      - name: Build library (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Run all examples (skipped here — run in matrix job)
        run: echo "Examples are tested in a dedicated matrix job on Linux and macOS runners"

      - name: Run benchmarks
        run: zig build bench

      - name: Zig format check
        run: zig fmt --check src/ examples/

  examples-run:
    name: Run Examples Matrix (hostable targets)
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-latest
            target: x86_64-macos
            - os: windows-2025-vs2026
            target: x86_64-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run Zig tests on ${{ matrix.target }}
        run: zig build test -Dtarget=${{ matrix.target }} --summary all

      - name: Run all examples on ${{ matrix.target }}
        run: |
          echo "Running examples for ${{ matrix.target }}"
          zig build run-all-examples -Dtarget=${{ matrix.target }}

  examples-build-only:
    name: Build Library Matrix (build-only for many targets)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-linux
          - x86-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - x86-windows
          - x86_64-freestanding
          - aarch64-freestanding
          - riscv64-freestanding
          - riscv64-linux
          - riscv32-linux
          - powerpc64le-linux
          - mips64-linux
          - s390x-linux
          - arm-freestanding
          - arm-linux-gnueabihf
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build for ${{ matrix.target }} (build-only)
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=Debug

      - name: Build examples for supported non-native targets (compile-only)
        if: contains('x86_64-linux x86-linux aarch64-linux x86_64-macos aarch64-macos x86_64-windows x86-windows', matrix.target)
        run: |
          echo "Compiling all examples for ${{ matrix.target }}"
          zig build example-basic -Dtarget=${{ matrix.target }}
          zig build example-advanced -Dtarget=${{ matrix.target }}
          zig build example-config_modes -Dtarget=${{ matrix.target }}
          zig build example-negated_flags -Dtarget=${{ matrix.target }}
          zig build example-positional_validation -Dtarget=${{ matrix.target }}
          zig build example-select_all -Dtarget=${{ matrix.target }}
          zig build example-question_flow -Dtarget=${{ matrix.target }}
          zig build example-include_exclude -Dtarget=${{ matrix.target }}
          zig build example-include_exclude_strict -Dtarget=${{ matrix.target }}
          zig build example-file_support -Dtarget=${{ matrix.target }}
          zig build example-data_input_validation -Dtarget=${{ matrix.target }}
          zig build example-custom_parsing -Dtarget=${{ matrix.target }}
          zig build example-callbacks -Dtarget=${{ matrix.target }}
          zig build example-key_value -Dtarget=${{ matrix.target }}
          zig build example-struct_demo -Dtarget=${{ matrix.target }}
          zig build example-expect_validation -Dtarget=${{ matrix.target }}
          zig build example-update_check -Dtarget=${{ matrix.target }}
